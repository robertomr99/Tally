<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      line-height: 1;
    }
    @keyframes scan-laser {
      0% { top: 12%; opacity: 0.8; }
      50% { top: 86%; opacity: 1; }
      100% { top: 12%; opacity: 0.8; }
    }
    .scanner-beam {
      animation: scan-laser 3.2s ease-in-out infinite;
    }

<body class="bg-black text-on-surface antialiased select-none overflow-hidden h-screen w-screen flex flex-col justify-between">
<!-- Simulación Cámara Fullscreen en vivo con ticket de fondo -->
<div class="absolute inset-0 z-0 overflow-hidden">
<div class="w-full h-full bg-cover bg-center scale-105 filter brightness-75 contrast-110" data-alt="Close up birds eye view of a realistic printed grocery store paper receipt resting on a dark slate matte table surface under controlled ambient photography studio lighting. Technical camera perspective simulating a live smartphone camera viewfinder stream with subtle lens grain, sharp text contrasts, and minimalist corporate tones." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuASbyb6hvcId_KONIplJVVXAmt6AEavSJqGESIvj6CLVsdTGp-9N0vepe3v5W4s2_EhlXCVLn1dgSk8r49qpFk-SHQ2SDYEBAJEJkzcU_oTBSrK3IpaEjByl_px3nvID_oa_7Xvfhk1Pqk44Nlsm5X1FOT90cpdLnPkinvTMu_FDdiZ4pYEKW1HjWTxkYbngAVq_gnkHNobWb_TjfV9nwOUILWO3n-vp386ZtoCoUe8F62hbkZ27IUG4w')">
</div>
<!-- Scrim oscuro de enfoque de captura (65% oscurecimiento exterior) -->
<div class="absolute inset-0 bg-black/60 pointer-events-none"></div>
</div>
<!-- Header Superior Translúcido: Controles de Captura y Flash -->
<header class="relative z-20 w-full px-margin-mobile pt-10 pb-4 flex flex-col gap-3 bg-gradient-to-b from-black/80 via-black/40 to-transparent backdrop-blur-xs">
<div class="flex items-center justify-between w-full">
<!-- Botón Flash / Linterna -->
<button aria-label="Alternar Linterna" class="w-10 h-10 rounded-full bg-white/10 active:bg-white/25 flex items-center justify-center text-white transition-colors duration-150 backdrop-blur-md" id="flash-toggle" type="button">
<span class="material-symbols-outlined text-title-lg" data-icon="flash_on">flash_on</span>
</button>
<!-- Selector Modo: Automático vs Manual -->
<div class="inline-flex items-center p-1 bg-black/40 backdrop-blur-md rounded-full border border-white/10">
<button class="px-3.5 py-1 rounded-full bg-secondary-container text-on-secondary-container font-label-md text-label-md transition-all duration-150" id="mode-auto" type="button">
          Auto
        </button>
<button class="px-3.5 py-1 rounded-full text-white/80 hover:text-white font-label-md text-label-md transition-all duration-150" id="mode-manual" type="button">
          Manual
        </button>
</div>
<!-- Ajustes de escaneo / OCR Grid -->
<button aria-label="Rejilla de asistencia" class="w-10 h-10 rounded-full bg-white/10 active:bg-white/25 flex items-center justify-center text-white transition-colors duration-150 backdrop-blur-md" type="button">
<span class="material-symbols-outlined text-title-lg" data-icon="grid_on">grid_on</span>
</button>
</div>
<!-- Píldora de Instrucción de alineación -->
<div class="flex justify-center mt-1">
<div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-black/60 border border-white/15 backdrop-blur-md">
<span class="w-1.5 h-1.5 rounded-full bg-secondary-fixed animate-ping"></span>
<span class="text-white font-label-md text-label-md tracking-wide">Alinea los bordes del ticket dentro del recuadro</span>
</div>
</div>
</header>
<!-- Viewfinder Central & Retícula de Reconocimiento M3 -->
<main class="relative z-10 flex-1 flex items-center justify-center px-6">
<div class="relative w-full max-w-xs sm:max-w-sm h-[68vh] max-h-[500px]">
<!-- Fondo translúcido claro para la zona de encuadre activa -->
<div class="absolute inset-0 bg-transparent rounded-xl pointer-events-none ring-1 ring-white/10"></div>
<!-- Corner Brackets de Alta Precisión (24dp x 3px) en Secondary Color (#aff1c5) -->
<!-- Esquina Superior Izquierda -->
<div class="absolute -top-0.5 -left-0.5 w-6 h-6 border-t-[3px] border-l-[3px] border-secondary-fixed rounded-tl-lg"></div>
<!-- Esquina Superior Derecha -->
<div class="absolute -top-0.5 -right-0.5 w-6 h-6 border-t-[3px] border-r-[3px] border-secondary-fixed rounded-tr-lg"></div>
<!-- Esquina Inferior Izquierda -->
<div class="absolute -bottom-0.5 -left-0.5 w-6 h-6 border-b-[3px] border-l-[3px] border-secondary-fixed rounded-bl-lg"></div>
<!-- Esquina Inferior Derecha -->
<div class="absolute -bottom-0.5 -right-0.5 w-6 h-6 border-b-[3px] border-r-[3px] border-secondary-fixed rounded-br-lg"></div>
<!-- Guías de Alineación Verticales y Horizontales Matemáticas -->
<div class="absolute inset-x-4 top-1/3 border-t border-dashed border-white/20 pointer-events-none"></div>
<div class="absolute inset-x-4 top-2/3 border-t border-dashed border-white/20 pointer-events-none"></div>
<div class="absolute inset-y-4 left-1/2 border-l border-dashed border-white/20 pointer-events-none"></div>
<!-- Simulación de Bounding Box de OCR / Detección en Tiempo Real -->
<div class="absolute top-[28%] left-[10%] right-[10%] h-8 bg-secondary-container/20 border border-secondary-fixed/70 rounded flex items-center justify-between px-2 pointer-events-none">
<span class="text-secondary-fixed font-label-sm text-label-sm tracking-tight">MERCADONA S.A.</span>
<span class="px-1 py-0.5 bg-secondary text-white font-label-sm text-[9px] rounded leading-none">99.4% OCR</span>
</div>
<div class="absolute top-[38%] left-[15%] right-[20%] h-6 bg-secondary-container/15 border border-secondary-fixed/50 rounded flex items-center justify-between px-2 pointer-events-none">
<span class="text-secondary-fixed font-label-sm text-label-sm tracking-tight">TOTAL FACTURA</span>
<span class="text-white font-label-sm text-[10px] font-semibold">24,85 €</span>
</div>
<!-- Rayo Láser de Escaneo Computacional -->
<div class="scanner-beam absolute left-2 right-2 h-[2px] bg-gradient-to-r from-transparent via-secondary-fixed to-transparent shadow-[0_0_12px_#aff1c5] pointer-events-none"></div>
</div>
</main>
<!-- Zona Inferior: Detección de Luz y Controles de Cámara Android M3 -->
<footer class="relative z-20 w-full flex flex-col items-center pb-8 pt-3 bg-gradient-to-t from-black via-black/85 to-transparent">
<!-- Notificador de Calidad de Luz -->
<div class="mb-5 inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-highest/20 border border-white/10 text-white backdrop-blur-md">
<span class="material-symbols-outlined text-secondary-fixed text-title-sm" data-icon="wb_sunny">wb_sunny</span>
<span class="font-label-md text-label-md text-inverse-on-surface">Buena luz detectada</span>
</div>
<!-- Barra de Acciones de Disparo & Navegación -->
<div class="w-full px-8 flex items-center justify-between max-w-md">
<!-- Izquierda: Galería con Miniatura de Imagen Previa -->
<button aria-label="Abrir galería" class="group flex flex-col items-center gap-1.5 focus:outline-none" type="button">
<div class="w-12 h-12 rounded-xl overflow-hidden border border-white/30 bg-surface-container-high relative active:scale-95 transition-transform duration-100 ease-out shadow-sm">
<div class="w-full h-full bg-cover bg-center" data-alt="Thumbnail preview of a previous digital payment invoice receipt card sitting in a minimal gallery library view with clean emerald accents." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBOSytMEMV5mL6J0kd75kpIQeKH1urOZ4vWJZXj4jD8OIKQvrRc_P6WXoOyTSV4EZXVzjLJRTD3cuFGi0ZGOjE-DyvAN4Dkcta8Yw5ZexTNMVY-ThSkjq6EJJfaVrhfCluKqvF95O1NQEjUWz7NOSkhEm30fl0CHchIYj_r2Zi21lQcMKfsjTLjQINCua1kcsZQGeKJnY9pzbwFyvcOo3MqUst2Zpk5HB5Aeq4IRxIAlH8IaiBOxxcLhQ')">
</div>
<div class="absolute inset-0 bg-black/10 group-hover:bg-transparent transition-colors"></div>
</div>
<span class="text-white/80 font-label-sm text-label-sm group-hover:text-white">Galería</span>
</button>
<!-- Centro: Botón de Disparo Principal Android M3 -->
<div class="relative flex items-center justify-center">
<!-- Anillo exterior con margen calibrado -->
<button aria-label="Capturar fotografía de ticket" class="relative w-20 h-20 rounded-full border-[3px] border-white/90 p-1 flex items-center justify-center focus:outline-none active:scale-90 transition-transform duration-150 ease-out hover:border-secondary-fixed" id="shutter-btn" type="button">
<!-- Núcleo interior del disparador -->
<div class="w-full h-full rounded-full bg-white active:bg-secondary-fixed transition-colors duration-150 flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-primary text-title-md opacity-0 transition-opacity duration-150" data-icon="document_scanner">document_scanner</span>
</div>
</button>
</div>
<!-- Derecha: Cancelar y Cerrar (Retorno de Navegación) -->
<button aria-label="Cancelar captura" class="group flex flex-col items-center gap-1.5 focus:outline-none active:scale-95 transition-transform duration-100 ease-out" onclick="window.history.back()" type="button">
<div class="w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 border border-white/15 flex items-center justify-center text-white transition-colors duration-150">
<span class="material-symbols-outlined text-headline-sm" data-icon="close">close</span>
</div>
<span class="text-white/80 font-label-sm text-label-sm group-hover:text-white">Cerrar</span>
</button>
</div>
</footer>
<!-- Microinteracción Script para Feedback Táctil y Modos -->
<script>
    const shutter = document.getElementById('shutter-btn');
    const flashBtn = document.getElementById('flash-toggle');
    const autoBtn = document.getElementById('mode-auto');
    const manualBtn = document.getElementById('mode-manual');
    let flashActive = false;

    if (shutter) {
      shutter.addEventListener('click', () => {
        // Flash visual de obturación de cámara
        const flashOverlay = document.createElement('div');
        flashOverlay.className = 'fixed inset-0 bg-white z-50 pointer-events-none transition-opacity duration-300 opacity-100';
        document.body.appendChild(flashOverlay);
        setTimeout(() => {
          flashOverlay.classList.remove('opacity-100');
          flashOverlay.classList.add('opacity-0');
          setTimeout(() => flashOverlay.remove(), 300);
        }, 80);
      });
    }

    if (flashBtn) {
      flashBtn.addEventListener('click', () => {
        flashActive = !flashActive;
        const icon = flashBtn.querySelector('.material-symbols-outlined');
        if (flashActive) {
          flashBtn.classList.remove('bg-white/10', 'text-white');
          flashBtn.classList.add('bg-secondary-fixed', 'text-on-secondary-fixed-variant');
          icon.textContent = 'flash_on';
        } else {
          flashBtn.classList.add('bg-white/10', 'text-white');
          flashBtn.classList.remove('bg-secondary-fixed', 'text-on-secondary-fixed-variant');
          icon.textContent = 'flash_off';
        }
      });
    }

    if (autoBtn && manualBtn) {
      autoBtn.addEventListener('click', () => {
        autoBtn.className = 'px-3.5 py-1 rounded-full bg-secondary-container text-on-secondary-container font-label-md text-label-md transition-all duration-150';
        manualBtn.className = 'px-3.5 py-1 rounded-full text-white/80 hover:text-white font-label-md text-label-md transition-all duration-150';
      });

      manualBtn.addEventListener('click', () => {
        manualBtn.className = 'px-3.5 py-1 rounded-full bg-secondary-container text-on-secondary-container font-label-md text-label-md transition-all duration-150';
        autoBtn.className = 'px-3.5 py-1 rounded-full text-white/80 hover:text-white font-label-md text-label-md transition-all duration-150';
      });
    }
  </script>
</body></html>
