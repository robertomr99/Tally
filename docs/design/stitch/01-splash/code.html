<style>
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      font-size: 16px;
      line-height: 1;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-feature-settings: 'liga';
      -webkit-font-smoothing: antialiased;
    }
  </style>

<body class="bg-primary text-on-primary h-full w-full overflow-hidden flex flex-col justify-between select-none antialiased">
<!-- Barra de estado nativa de Android (Top Safe Area / Status Bar) -->
<header class="w-full h-10 px-margin-mobile flex items-center justify-between z-10 opacity-70">
<!-- Reloj nativo estilo Material 3 -->
<div class="font-label-md text-label-md text-primary-fixed tracking-tight font-medium pl-1">
      9:41
    </div>
<!-- Iconos del sistema Android: Wi-Fi, Red Celular y Batería -->
<div class="flex items-center space-x-1.5 pr-1 text-primary-fixed">
<span class="material-symbols-outlined text-[15px]" data-icon="wifi">wifi</span>
<span class="material-symbols-outlined text-[15px]" data-icon="signal_cellular_4_bar">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[16px]" data-icon="battery_full">battery_full</span>
</div>
</header>
<!-- Contenedor central absoluto: Emblema geométrico de Tally -->
<main class="flex-1 flex items-center justify-center relative px-margin-mobile">
<div class="relative flex items-center justify-center p-space-md">
<!-- Tally Marks Iconography (Pure Geometric Material Design) -->
<div class="relative w-28 h-28 sm:w-32 sm:h-32 flex items-center justify-between px-1">
<!-- 4 barras verticales calibradas con bordes suaves -->
<div class="w-2.5 sm:w-3 h-20 sm:h-24 bg-primary-fixed rounded-full shadow-sm transition-all duration-300"></div>
<div class="w-2.5 sm:w-3 h-20 sm:h-24 bg-primary-fixed rounded-full shadow-sm transition-all duration-300"></div>
<div class="w-2.5 sm:w-3 h-20 sm:h-24 bg-primary-fixed rounded-full shadow-sm transition-all duration-300"></div>
<div class="w-2.5 sm:w-3 h-20 sm:h-24 bg-primary-fixed rounded-full shadow-sm transition-all duration-300"></div>
<!-- Barra diagonal dinámica que cruza las 4 marcas (trazo distintivo de conteo) -->
<div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-32 sm:w-36 h-2.5 sm:h-3 bg-primary-fixed rounded-full -rotate-[28deg] origin-center shadow-md border border-primary/20"></div>
</div>
</div>
</main>
<!-- Barra de navegación por gestos nativa de Android (Navigation Bar Pill) -->
<footer class="w-full h-8 flex items-center justify-center pb-2 z-10">
<div class="w-28 h-1 bg-primary-fixed opacity-40 rounded-full"></div>
</footer>
