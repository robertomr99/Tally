[versions]
agp = "9.2.1"
kotlin = "2.2.10"
ksp = "2.2.10-2.0.2"
composeBom = "2026.02.01"
hilt = "2.60.1"
room = "2.7.2"
coroutines = "1.10.2"
turbine = "1.1.0"
junit = "4.13.2"
activityCompose = "1.13.0"
coreKtx = "1.18.0"
lifecycle = "2.10.0"
minSdk = "26"
compileSdk = "36"
targetSdk = "36"
appVersionCode = "1"
appVersionName = "1.0"
# MediaPipe GenAI (LLM Inference). Última rama 0.10.x con `LlmInference` en Android
# (la rama 1.x lo retiró). Soporta Gemma 3/V3 desde 0.10.24. Ver R1 en
# docs/risks-and-open-questions.md.
mediapipeGenai = "0.10.35"
# androidx.test para los tests instrumentados (spike Gemma).
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"
androidxTestJunit = "1.3.0"
# Espresso para los tests instrumentados de UI (NavigationTest de :app). Se fija
# explícitamente 3.7.0 porque ui-test-junit4 trae transitivo 3.5.0, que falla en
# API 35+ (NoSuchMethodException InputManager.getInstance al inyectar eventos);
# ver sesión 008 de PROGRESS.md.
androidxTestEspresso = "3.7.0"
# Navegación de :app (NavHost + rutas). Fuera del Compose BOM: última estable
# de la línea compatible con compileSdk 36 (2.10.x exige compileSdk 37 vía
# lifecycle 2.11.0; ver sesión 008 de PROGRESS.md).
navigationCompose = "2.9.8"
# javax.inject para el @Inject constructor de los repositorios de :domain:*
# (AGENTS.md); sin dependencias de Android en dominio.
javaxInject = "1"
# CameraX (solo :feature:escanear, spec captura-foto). Ultima estable de la
# linea (1.7.0 es alpha); compatible con compileSdk 36. Ver sesion 012 de
# PROGRESS.md.
cameraX = "1.6.2"
# androidx.exifinterface para corregir la orientacion EXIF de la foto capturada
# (pipeline de captura-foto). Ultima estable.
exifinterface = "1.4.2"
# hiltViewModel() en Compose (androidx.hilt:hilt-navigation-compose). Linea
# 1.2.x: la 1.4.0 exige compileSdk 37 (AAR metadata) y este repo fija 36.
hiltNavigationCompose = "1.2.0"
# androidx.test:rules (GrantPermissionRule del E2E de captura). Misma linea
# 1.7.0 que androidxTestCore/Runner ya en el catalogo.
androidxTestRules = "1.7.0"

[libraries]
# Artefactos de plugin (los usa build-logic)
android-gradle-plugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-compose-gradle-plugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradle-plugin = { group = "com.google.devtools.ksp", name = "symbol-processing-gradle-plugin", version.ref = "ksp" }
hilt-gradle-plugin = { group = "com.google.dagger", name = "hilt-android-gradle-plugin", version.ref = "hilt" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }

# javax.inject + dagger-compiler para :domain:expenses (TicketRepository con
# @Inject constructor). dagger y dagger-compiler comparten línea de versión con
# Hilt (com.google.dagger publica las tres con la misma versión). dagger es el
# runtime que necesita el código generado (dagger.internal.Factory).
javax-inject = { group = "javax.inject", name = "javax.inject", version.ref = "javaxInject" }
dagger = { group = "com.google.dagger", name = "dagger", version.ref = "hilt" }
dagger-compiler = { group = "com.google.dagger", name = "dagger-compiler", version.ref = "hilt" }

# Room (catálogo listo para la feature persistencia-room)
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Coroutines y Turbine (para :test:unit)
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }

# MediaPipe GenAI / LLM Inference (motor local Gemma; ver R1)
mediapipe-tasks-genai = { group = "com.google.mediapipe", name = "tasks-genai", version.ref = "mediapipeGenai" }

# AndroidX y Compose
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
# LocalLifecycleOwner para el binding de CameraX (captura-foto); misma linea
# de version lifecycle.
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Iconos extendidos de Material (insights, receipt_long, document_scanner de la
# bottom bar). Los gestiona el Compose BOM (artefacto congelado en 1.7.8).
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Navegación de :app (NavHost, rememberNavController, composable por ruta String)
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# CameraX (binding de UI de la camara en :feature:escanear; spec captura-foto)
camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "cameraX" }
camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "cameraX" }
camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "cameraX" }
camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "cameraX" }

# EXIF del pipeline de foto (:framework:database; spec captura-foto)
exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }

# hiltViewModel() para las pantallas Compose (:feature:escanear; captura-foto)
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Tests
junit = { group = "junit", name = "junit", version.ref = "junit" }
# Tests instrumentados (androidx.test), usado por el harness del spike Gemma.
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
# Tests instrumentados de UI Compose (NavigationTest de :app); los gestiona el Compose BOM.
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
# Espresso (fuerza 3.7.0 sobre el 3.5.0 transitivo de ui-test-junit4; API 35+).
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidxTestEspresso" }
# Rules de androidx.test (GrantPermissionRule en CapturaFlujoTest; captura-foto).
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTestRules" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
